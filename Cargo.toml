[package]
name = "scriptor"
version = "0.3.0-alpha.3"
edition = "2024"
license = "MIT"
description = "CLI de capture vérifiable de sources locales et web"
repository = "https://github.com/benja971/scriptor"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
fs2 = "0.4.3"
nix = { version = "0.31.3", features = ["process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
toml = "1.1.5"
tantivy = "0.26.2"
url = "2.5.8"
unicode-normalization = "0.1.25"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Deny panic-prone operations
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# Already part of `pedantic`, repeated here for documentation
enum_glob_use = "deny"
unchecked_time_subtraction = "deny"

# Additional opinionated idiom lints
clone_on_ref_ptr = "deny"
clone_on_copy = "deny"
undocumented_unsafe_blocks = "deny"
