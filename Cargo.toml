[package]
name = "scriptor"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "CLI de transcription audio/vidéo vers texte, 100% local (whisper.cpp)"
repository = "https://github.com/benja971/scriptor"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Deny panic-prone operations
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# Already part of `pedantic`, repeated here for documentation
enum_glob_use = "deny"
unchecked_time_subtraction = "deny"

# Additional opinionated idiom lints
clone_on_ref_ptr = "deny"
clone_on_copy = "deny"
undocumented_unsafe_blocks = "deny"
